<!doctype html>
<html lang="sl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Šolska opažanja</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:clamp(16px,6vw,64px);font:17px/1.5 system-ui,sans-serif;color:#193c32;background:#eef5ef}main{max-width:620px;margin:auto;background:white;border-top:6px solid #21634a;padding:clamp(22px,5vw,48px)}header{display:flex;align-items:center;justify-content:space-between;gap:12px}select{padding:8px}h1{line-height:1.15}button{font:inherit;padding:10px 18px;color:#364b42;background:#e8eee9;border:1px solid #bac9bf;border-radius:5px}
</style>
<main><header><strong>DOŠ Prosenjakovci</strong><select aria-label="Jezik / Nyelv"><option value="sl">Slovenščina</option><option value="hu">Magyar</option></select></header>
<h1>Šolska opažanja</h1><p>Prijava s šolskim računom bo na voljo po povezavi z Microsoft 365.</p><button disabled>Prijava z Microsoft 365</button></main>
<script>
const text = {
  sl: ["Šolska opažanja","Prijava s šolskim računom bo na voljo po povezavi z Microsoft 365.","Prijava z Microsoft 365"],
  hu: ["Iskolai megfigyelések","Az iskolai fiókkal való bejelentkezés a Microsoft 365 csatlakoztatása után lesz elérhető.","Bejelentkezés a Microsoft 365-tel"]
};
document.querySelector("select").addEventListener("change", event => {
  const language = event.target.value;
  document.documentElement.lang = language;
  const [title, status, action] = text[language];
  document.title = title;
  document.querySelector("h1").textContent = title;
  document.querySelector("p").textContent = status;
  document.querySelector("button").textContent = action;
});
</script>
</html>
